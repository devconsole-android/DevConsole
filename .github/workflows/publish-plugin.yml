name: Publish Gradle plugin

# Tag-triggered but not automatic: the `plugin-portal` environment gates the publish behind a
# human approval, because a published Portal version can never be replaced or deleted.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: plugin-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # A tag that disagrees with the plugin's own version would publish the wrong coordinate,
      # and the Portal will not let it be corrected afterwards.
      - name: Tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' gradle-plugin/build.gradle.kts)"
          if [ "$tag_version" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME implies $tag_version but gradle-plugin declares $declared." >&2
            exit 1
          fi
          echo "Publishing io.github.devconsole-android $declared"

      - run: ./gradlew -p gradle-plugin test --stacktrace

      - name: Publish to the Gradle Plugin Portal
        run: >
          ./gradlew -p gradle-plugin publishPlugins --stacktrace
          -Pgradle.publish.key="$GRADLE_PUBLISH_KEY"
          -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
