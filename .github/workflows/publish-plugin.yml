name: Publish Gradle plugin

# A pushed `v*` tag is the release decision, so publishing follows it automatically. The guards
# below cover what a tag does not assert: that the version is the intended one and the suite passes.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Pinned: this workflow holds the Portal credentials, so a moved tag upstream would run
      # unreviewed code next to them. Bump deliberately.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # A tag that disagrees with the plugin's own version would publish the wrong coordinate,
      # and the Portal will not let it be corrected afterwards.
      - name: Tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' gradle-plugin/build.gradle.kts)"
          if [ "$tag_version" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME implies $tag_version but gradle-plugin declares $declared." >&2
            exit 1
          fi
          echo "Publishing io.github.devconsole-android $declared"

      - run: ./gradlew -p gradle-plugin test --stacktrace

      - name: Publish to the Gradle Plugin Portal
        run: >
          ./gradlew -p gradle-plugin publishPlugins --stacktrace
          -Pgradle.publish.key="$GRADLE_PUBLISH_KEY"
          -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
